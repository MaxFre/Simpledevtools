<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator — DevTools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
  <style>
    .pw-list { list-style:none; display:flex; flex-direction:column; gap:0.4rem; }
    .pw-item {
      display:flex; align-items:center; gap:0.75rem;
      background:var(--bg); border:1px solid var(--border); border-radius:10px;
      padding:0.65rem 1rem; font-family:var(--mono); font-size:0.9rem;
      transition:all 0.3s var(--ease-out);
    }
    .pw-item:hover { border-color:rgba(245,184,85,0.35); box-shadow:0 4px 12px rgba(245,184,85,0.08); }
    .pw-value { flex:1; word-break:break-all; color:var(--text); letter-spacing:0.04em; }
    .pw-copy-btn {
      background:none; border:1px solid transparent; cursor:pointer;
      color:var(--muted); font-size:0.9rem; padding:0.25rem 0.4rem;
      border-radius:8px; transition:all 0.2s; flex-shrink:0; line-height:1;
    }
    .pw-copy-btn:hover { color:var(--accent3); background:rgba(245,184,85,0.1); border-color:rgba(245,184,85,0.2); }
    .pw-copy-btn.copied { color:var(--success); }
    .strength-bar { height:4px; border-radius:4px; margin-top:0.35rem; transition:width 0.4s,background 0.4s; }
    .stat-row { display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom:0.75rem; }
    .stat {
      background:var(--bg); border:1px solid var(--border); border-radius:10px;
      padding:0.55rem 1rem; font-size:0.78rem; color:var(--muted);
      display:flex; align-items:center; gap:0.5rem;
    }
    .stat strong { color:var(--accent3); font-size:0.95rem; font-weight:700; }
    .charset-grid { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.25rem; }
    .charset-chip {
      display:flex; align-items:center; gap:0.4rem;
      background:var(--bg); border:1px solid var(--border); border-radius:8px;
      padding:0.3rem 0.75rem; font-size:0.8rem; color:var(--text-secondary);
      cursor:pointer; transition:all 0.2s; user-select:none;
    }
    .charset-chip input { accent-color:var(--accent3); cursor:pointer; }
    .charset-chip:hover { border-color:var(--border-hover); }
    .range-row { display:flex; align-items:center; gap:1rem; }
    .range-row input[type=range] { flex:1; accent-color:var(--accent3); }
    .range-val { font-family:var(--mono); font-weight:700; color:var(--accent3); min-width:2.5rem; text-align:right; }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="noise"></div>
  <nav>
    <a href="index.html" class="nav-brand"><div class="logo-icon">⚡</div>DevTools</a>
    <button id="theme-toggle" onclick="window.__toggleTheme()" title="Switch theme"><span class="theme-icon">☾</span></button>
    <div class="nav-search-wrap">
      <div class="nav-search-row">
        <span class="ns-icon">🔍</span>
        <input id="nav-search-input" type="text" placeholder="Search tools…" autocomplete="off" spellcheck="false" />
        <button id="nav-search-clear" aria-label="Clear">✕</button>
      </div>
      <div class="nav-search-dropdown" id="nav-search-dropdown"></div>
    </div>
    <ul class="nav-links"><li><a href="index.html">← All Tools</a></li></ul>
  </nav>

  <main class="fade-in">
    <div class="page-header">
      <div class="badge">🔐 Generator</div>
      <h1>Password Generator</h1>
      <p>Generate strong, cryptographically random passwords. Choose length and character types.</p>
    </div>

    <div class="card">
      <div class="card-title">Options</div>
      <div style="margin-bottom:1rem;">
        <label>Length: <span id="len-display">20</span></label>
        <div class="range-row">
          <input type="range" id="pw-length" min="4" max="128" value="20" oninput="document.getElementById('len-display').textContent=this.value" />
          <span class="range-val" id="len-display2"></span>
        </div>
      </div>
      <div style="margin-bottom:1rem;">
        <label for="pw-count">Count</label>
        <input type="number" id="pw-count" value="5" min="1" max="50" />
      </div>
      <label>Include</label>
      <div class="charset-grid">
        <label class="charset-chip"><input type="checkbox" id="pw-upper" checked /> Uppercase A–Z</label>
        <label class="charset-chip"><input type="checkbox" id="pw-lower" checked /> Lowercase a–z</label>
        <label class="charset-chip"><input type="checkbox" id="pw-digits" checked /> Digits 0–9</label>
        <label class="charset-chip"><input type="checkbox" id="pw-symbols" checked /> Symbols !@#$…</label>
      </div>
      <div class="btn-group" style="margin-top:1.25rem;">
        <button class="btn btn-primary" onclick="generate()">⚡ Generate</button>
        <button class="btn btn-secondary" onclick="copyAll()">📋 Copy all</button>
        <button class="btn btn-ghost" onclick="clearAll()">✕ Clear</button>
      </div>
    </div>

    <div class="stat-row" id="pw-stats" style="display:none;"></div>
    <div class="card" id="pw-output" style="display:none;">
      <div class="card-title">Generated Passwords</div>
      <ul class="pw-list" id="pw-list"></ul>
    </div>
  </main>

  <footer>Built with precision — <a href="index.html">DevTools</a></footer>
  <div class="toast" id="toast"></div>

  <script>
    const UPPER='ABCDEFGHIJKLMNOPQRSTUVWXYZ', LOWER='abcdefghijklmnopqrstuvwxyz';
    const DIGITS='0123456789', SYMBOLS='!@#$%^&*()-_=+[]{}|;:,.<>?';

    function randStr(len, charset) {
      const a = new Uint32Array(len);
      crypto.getRandomValues(a);
      return Array.from(a).map(n=>charset[n%charset.length]).join('');
    }

    function entropy(len, charsetSize) {
      return Math.round(len * Math.log2(charsetSize));
    }

    function strengthLabel(bits) {
      if (bits < 40)  return ['Weak',    '#ef4444', '30%'];
      if (bits < 60)  return ['Fair',    '#f97316', '55%'];
      if (bits < 80)  return ['Good',    '#eab308', '72%'];
      if (bits < 100) return ['Strong',  '#22c55e', '88%'];
      return             ['Very Strong','#10b981', '100%'];
    }

    function generate() {
      const length = parseInt(document.getElementById('pw-length').value)||20;
      const count  = Math.min(Math.max(parseInt(document.getElementById('pw-count').value)||1,1),50);
      let charset = '';
      if (document.getElementById('pw-upper').checked)   charset += UPPER;
      if (document.getElementById('pw-lower').checked)   charset += LOWER;
      if (document.getElementById('pw-digits').checked)  charset += DIGITS;
      if (document.getElementById('pw-symbols').checked) charset += SYMBOLS;
      if (!charset) { showToast('Select at least one character type','error'); return; }

      const bits = entropy(length, charset.length);
      const [label, color, width] = strengthLabel(bits);

      const list = document.getElementById('pw-list');
      list.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const pw = randStr(length, charset);
        const li = document.createElement('li');
        li.className = 'pw-item';
        li.innerHTML = `<span class="pw-value">${esc(pw)}</span><button class="pw-copy-btn" title="Copy" onclick="copyItem(this)">⧉</button>`;
        list.appendChild(li);
      }
      document.getElementById('pw-output').style.display = '';
      const stats = document.getElementById('pw-stats');
      stats.style.display = 'flex';
      stats.innerHTML = `<div class="stat"><strong>${count}</strong> password${count!==1?'s':''}</div><div class="stat"><strong>${length}</strong> chars</div><div class="stat"><strong>${bits}</strong> bits entropy</div><div class="stat"><strong style="color:${color}">${label}</strong></div>`;
      showToast(`Generated ${count} password${count!==1?'s':''}`, 'success');
    }

    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function copyItem(btn) {
      navigator.clipboard.writeText(btn.previousElementSibling.textContent).then(()=>{
        btn.textContent='✓'; btn.classList.add('copied');
        setTimeout(()=>{ btn.textContent='⧉'; btn.classList.remove('copied'); },1500);
      });
    }
    function copyAll() {
      const items = document.querySelectorAll('.pw-value');
      if (!items.length) { showToast('Nothing to copy','error'); return; }
      navigator.clipboard.writeText(Array.from(items).map(el=>el.textContent).join('\n'))
        .then(()=>showToast(`Copied ${items.length} password${items.length!==1?'s':''}`, 'success'));
    }
    function clearAll() {
      document.getElementById('pw-list').innerHTML='';
      document.getElementById('pw-output').style.display='none';
      document.getElementById('pw-stats').style.display='none';
    }
    function showToast(msg,type='') {
      const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type;
      clearTimeout(t._timer); t._timer=setTimeout(()=>{ t.className='toast'; },2500);
    }
  </script>
  <script src="search.js"></script>
</body>
</html>
