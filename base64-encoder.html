<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base64 Encode / Decode — DevTools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
  <style>
    .editor-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 680px) { .editor-wrap { grid-template-columns: 1fr; } }

    .editor-panel { display: flex; flex-direction: column; gap: 0.75rem; }

    .panel-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    #input-text, #output-text {
      min-height: 300px;
      font-family: var(--mono);
      font-size: 0.82rem;
      resize: vertical;
      line-height: 1.7;
    }
    #output-text { cursor: default; }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .error-msg {
      display: none;
      align-items: center;
      gap: 0.5rem;
      color: var(--danger);
      font-size: 0.8rem;
      font-family: var(--mono);
      padding: 0.6rem 0.9rem;
      background: rgba(220,70,90,0.05);
      border: 1px solid rgba(220,70,90,0.2);
      border-radius: 10px;
      margin-top: 0.5rem;
    }
    .error-msg.show { display: flex; }

    .char-count {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      font-family: var(--mono);
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <nav>
    <a href="index.html" class="nav-brand">
      <div class="logo-icon">⚡</div>
      DevTools
    </a>
    <button id="theme-toggle" onclick="window.__toggleTheme()" title="Switch theme">
      <span class="theme-icon">☾</span>
    </button>
    <div class="nav-search-wrap">
      <div class="nav-search-row">
        <span class="ns-icon">🔍</span>
        <input id="nav-search-input" type="text" placeholder="Search tools…" autocomplete="off" spellcheck="false" />
        <button id="nav-search-clear" aria-label="Clear">✕</button>
      </div>
      <div class="nav-search-dropdown" id="nav-search-dropdown"></div>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">← All Tools</a></li>
    </ul>
  </nav>

  <main class="fade-in">

    <div class="page-header">
      <div class="badge" style="background:rgba(25,113,194,0.07);color:#1563b0;border-color:rgba(25,113,194,0.2);">⇄ Encoding</div>
      <h1>Base64 Encode / Decode</h1>
      <p>Encode plain text to Base64 or decode Base64 strings back to readable text.</p>
    </div>

    <div class="card">
      <div class="action-bar">
        <button class="btn btn-primary" onclick="encode()" style="background:linear-gradient(135deg,#1971c2,#4dabf7);border:none;color:#fff;box-shadow:0 2px 8px rgba(25,113,194,0.25);">→ Encode</button>
        <button class="btn btn-primary" onclick="decode()" style="background:linear-gradient(135deg,#0ca678,#63e6be);border:none;color:#000;box-shadow:0 2px 8px rgba(12,166,120,0.25);">← Decode</button>
        <button class="btn btn-secondary" onclick="swap()">⇄ Swap panels</button>
        <button class="btn btn-ghost" onclick="clearAll()">✕ Clear</button>
      </div>

      <div class="editor-wrap">
        <div class="editor-panel">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span class="panel-label">Input</span>
            <button class="btn btn-ghost" style="padding:0.25rem 0.6rem;font-size:0.72rem;" onclick="pasteInput()">⧉ Paste</button>
          </div>
          <textarea id="input-text" spellcheck="false" placeholder="Enter text to encode, or Base64 to decode…" oninput="updateCount()"></textarea>
          <div class="char-count" id="in-count">0 chars</div>
          <div class="error-msg" id="error-msg">⚠ <span id="error-text">Invalid input</span></div>
        </div>
        <div class="editor-panel">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span class="panel-label">Output</span>
            <button class="btn btn-ghost" style="padding:0.25rem 0.6rem;font-size:0.72rem;" onclick="copyOutput()">📋 Copy</button>
          </div>
          <textarea id="output-text" readonly spellcheck="false" placeholder="Result will appear here…"></textarea>
          <div class="char-count" id="out-count">0 chars</div>
        </div>
      </div>
    </div>

  </main>

  <footer>Built with precision — <a href="index.html">DevTools</a></footer>
  <div class="toast" id="toast"></div>

  <script>
    function encode() {
      clearError();
      const val = document.getElementById('input-text').value;
      try {
        const result = btoa(unescape(encodeURIComponent(val)));
        setOutput(result);
      } catch(e) {
        showError('Encoding failed: ' + e.message);
      }
    }

    function decode() {
      clearError();
      const val = document.getElementById('input-text').value.trim();
      try {
        const result = decodeURIComponent(escape(atob(val)));
        setOutput(result);
      } catch(e) {
        showError('Invalid Base64 — check input and try again');
      }
    }

    function swap() {
      const a = document.getElementById('input-text');
      const b = document.getElementById('output-text');
      const tmp = a.value; a.value = b.value; b.value = tmp;
      clearError(); updateCount();
    }

    function clearAll() {
      document.getElementById('input-text').value = '';
      document.getElementById('output-text').value = '';
      document.getElementById('in-count').textContent = '0 chars';
      document.getElementById('out-count').textContent = '0 chars';
      clearError();
    }

    function setOutput(val) {
      document.getElementById('output-text').value = val;
      document.getElementById('out-count').textContent = val.length + ' chars';
    }

    function updateCount() {
      const len = document.getElementById('input-text').value.length;
      document.getElementById('in-count').textContent = len + ' chars';
    }

    function clearError() {
      document.getElementById('error-msg').classList.remove('show');
    }

    function showError(msg) {
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-msg').classList.add('show');
    }

    async function pasteInput() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('input-text').value = text;
        updateCount(); clearError();
      } catch(e) { showToast('Clipboard access denied'); }
    }

    function copyOutput() {
      const val = document.getElementById('output-text').value;
      if (!val) return showToast('Nothing to copy');
      navigator.clipboard.writeText(val).then(() => showToast('Copied!'));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }
  </script>
  <script src="search.js"></script>
</body>
</html>
